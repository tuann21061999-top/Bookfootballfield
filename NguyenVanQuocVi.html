<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nguyễn Văn Quốc Vĩ</title>

    <style>
        /* YÊU CẦU:
        - Căn giữa nội dung
        - Đổi màu tiêu đề
        //- Tạo khung cho kết quả
        */
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        h2 {
            color: #2E8B57;
        }
        #result {
            border: 2px solid #2E8B57;
            padding: 15px;
            margin: 20px auto;
            width: 300px;
            border-radius: 10px;
            background-color: #F0FFF0;
        }      
    </style>
</head>
<body>

<h2>KIỂM TRA SỐ CHẴN LẺ & TÍNH TOÁN</h2>

<div id="result"></div>

<script>
    
    //YÊU CẦU JAVASCRIPT:

    //1. Viết hàm isEven(n) để kiểm tra chẵn lẻ, //SỬ DỤNG FUNCTION DECLARATION
    function isEven(n) {
        return n % 2 === 0;
    }
    /*2. Viết hàm calculate(n) trả về: //SỬ DỤNG ARROW FUNCTION
        - Bình phương
        - Gấp đôi
    */    
    const calculate = (n) => {
        return {
            square: n * n,
            double: n * 2
        };
    }
    //3. Dùng prompt() cho người dùng nhập số //ÉP KIỂU VÀ KIỂM TRA DỮ LIỆU NHẬP
    let input = prompt("Nhập một số:");
    let number = parseFloat(input);
    //4. Hiển thị kết quả ra div #result
    const resultDiv = document.getElementById("result");
    if (!isNaN(number)) {
        const evenOdd = isEven(number) ? "chẵn" : "lẻ";
        const calculations = calculate(number);
        resultDiv.innerHTML = `
            Số ${number} là số <strong>${evenOdd}</strong>.<br>
            Bình phương: <strong>${calculations.square}</strong><br>
            Gấp đôi: <strong>${calculations.double}</strong>
        `;
    } else {
        resultDiv.innerHTML = "Vui lòng nhập một số hợp lệ.";
    }
    
</script>

<h2>PHÂN TÍCH MẢNG SỐ</h2>

<p id="array"></p>
<ul id="output"></ul>

<script>
/*
YÊU CẦU JAVASCRIPT:

1. Tạo mảng numbers gồm ít nhất 5 số */
let lengthInput = prompt("Nhập độ dài mảng (ít nhất 5):");
let length = parseInt(lengthInput);
while (isNaN(length) || length < 5) {
    lengthInput = prompt("Vui lòng nhập độ dài mảng lớn hơn hoặc bằng 5:");
    length = parseInt(lengthInput);
}
let numbers = [];
for (let i = 0; i < length; i++) {
    numbers[i] = parseFloat(prompt(`Nhập phần tử thứ ${i + 1}:`));
}
/*2. Viết hàm: // KHÔNG dùng Array.sort() hay hàm có sẵn như Math.max(...arr)
    - sumArray(arr) //SỬ DỤNG FUNCTION DECLARATION
    - findMax(arr) //SỬ DỤNG FUNCTION DECLARATION
    - filterEven(arr) //SỬ DỤNG ARROW FUNCTION 
*/
function sumArray(arr) {
    let sum = 0;
    for (let num of arr) {
        sum += num;
    }
    return sum;
}
function findMax(arr) {
    let max = arr[0];
    for (let num of arr) {
        if (num > max) {
            max = num;
        }
    }
    return max;
}
const filterEven = (arr) => {
    let evenNumbers = [];
    for (let num of arr) {
        if (isEven(num)) {
            evenNumbers.push(num);
        }
    }
    return evenNumbers;
};   
/*3. Hiển thị:
    - Mảng ban đầu
    - Tổng các phần tử
    - Số lớn nhất
    - Danh sách số chẵn
*/
const arrayP = document.getElementById("array");   
arrayP.innerHTML = "Mảng ban đầu: " + numbers.join(", ");
document.getElementById("output").innerHTML = `
    Tổng các phần tử: ${sumArray(numbers)}<br>
    Số lớn nhất: ${findMax(numbers)}<br>
    Danh sách số chẵn: ${filterEven(numbers).join(", ")}
`;

</script>


</body>
</html>
